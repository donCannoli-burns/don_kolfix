name: CI

on:
  push:
    branches: [main, feature/don-report-contract-v1-20261030]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  node-version: "18"
  path: "dist"

jobs:
  state-preferences-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Validate Don State preference schema and safety gates
        run: node tests/state-preferences.test.cjs
      - name: Validate existing-installation safety with isolated fixtures
        run: node tests/install-mafia.test.cjs

  report-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned TypeScript
        run: npm install --global typescript@5.8.3
      - name: Compile pure Don Report contract
        run: tsc --strict --target es2020 --lib es2020 --module commonjs --outDir .report-build src/report-contract.ts
      - name: Test report addresses, source ownership, privacy, and conflict handling
        run: node tests/report-contract.test.cjs
      - name: Test atomic host receipt persistence and replay
        run: python3 -m unittest discover -s tests -p 'test_don_report_store.py' -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Cached Dependencies
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.node-version }}
          cache: "yarn"

      - name: Install New Dependencies
        run: yarn install --immutable

      - name: ESLint & Prettier
        run: yarn run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Cached Dependencies
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.node-version }}
          cache: "yarn"

      - name: Install New Dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn exec tsc --noEmit

      - name: Build
        run: yarn run build

  push:
    runs-on: ubuntu-latest
    needs: [build, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Cached Dependencies
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.node-version }}
          cache: "yarn"

      - name: Install New Dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: Commit & Push
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: release
          FOLDER: ${{ env.path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"
          SKIP_EMPTY_COMMITS: true
