name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  node-version: "18"
  path: "dist"

jobs:
  state-preferences-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Validate Don State preference schema and safety gates
        run: node tests/state-preferences.test.cjs
      - name: Validate existing-installation safety with isolated fixtures
        run: node tests/install-mafia.test.cjs

  security-credentials:
    name: security-credentials
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run security gate regression tests (offline)
        run: python3 -m unittest discover -s tests -p test_kolfix_security_gate.py -v
      - name: Compile host utilities (no network or gameplay)
        run: python3 -m py_compile tools/security/kolfix_security.py tools/security/kolfix_security_lease.py
      - name: Scan committed tree and history for sensitive artifacts
        run: |
          python3 tools/security/kolfix_security.py scan --index
          python3 tools/security/kolfix_security.py scan --revision HEAD

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Cached Dependencies
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.node-version }}
          cache: "yarn"

      - name: Install New Dependencies
        run: yarn install --immutable

      - name: ESLint & Prettier
        run: yarn run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Cached Dependencies
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.node-version }}
          cache: "yarn"

      - name: Install New Dependencies
        run: yarn install --immutable

      - name: Typecheck
        run: yarn exec tsc --noEmit

      - name: Build
        run: yarn run build

  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only the release publishing job can push the compiled distribution
    needs: [build, lint, security-credentials]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get Cached Dependencies
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.node-version }}
          cache: "yarn"

      - name: Install New Dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn run build

      - name: Commit & Push
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: release
          FOLDER: ${{ env.path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Build: ({sha}) {msg}"
          SKIP_EMPTY_COMMITS: true
